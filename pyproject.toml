[project]
name = "my-jarvis"
version = "0.1.0"
description = "Personal AI assistant - my jarvis"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "keyring>=25",
    "rich>=13",
    "websockets>=13",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.scripts]
jarvis = "my_jarvis.entrances.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
