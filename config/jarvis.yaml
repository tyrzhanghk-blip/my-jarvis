# ~/.my-jarvis/jarvis.yaml — 主配置模板
server:
  host: 127.0.0.1
  port: 8787

models:
  # 自定义 API 网关（中转/代理/私有部署）。留空则用官方端点或 OPENAI_BASE_URL 环境变量。
  base_url: ""
  api_key_env: OPENAI_API_KEY
  # 分层模型路由：strong 跑 agent，light 做参数填充/摘要；均可单独覆盖 base_url
  strong: { model: "hy4" }
  light:  { model: "hy3" }
  # 单独覆盖示例：
  # strong: { model: "gpt-4.1", base_url: "https://your-relay.example.com/v1", api_key_env: MY_KEY }

confirm:
  default_timeout_min: 10
  destructive_timeout_min: 30
  broadcast: false          # 确认请求是否广播全部入口

wecom:
  enabled: false
  corp_id_ref: "my-jarvis/wecom/corp_id"        # keyring 引用
  secret_ref: "my-jarvis/wecom/secret"
  token_ref: "my-jarvis/wecom/callback_token"
  aes_key_ref: "my-jarvis/wecom/aes_key"
  agent_id: ""
  allowed_userids: []        # 绑定用户，其他用户消息忽略

session:
  idle_timeout_min: 30
  retention_days: 30

log:
  dir: "~/.my-jarvis/logs"
